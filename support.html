<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>アプリサポート</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --card: #ffffff;
        --line: #d8e0ec;
        --text: #101827;
        --sub: #465469;
        --muted: #758196;
        --accent: #3b4a63;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
        line-height: 1.75;
        background: linear-gradient(180deg, #ffffff, var(--bg));
      }

      a {
        color: var(--accent);
        font-weight: 700;
      }

      .wrap {
        width: min(880px, calc(100% - 24px));
        margin: 24px auto 36px;
      }

      .hero,
      .section {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--card);
        box-shadow: 0 12px 28px rgba(32, 46, 70, 0.08);
      }

      .hero {
        padding: 26px 22px;
      }

      .section {
        margin-top: 14px;
        padding: 20px;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 40px);
        line-height: 1.3;
      }

      h2 {
        margin: 0 0 8px;
        font-size: 20px;
      }

      p {
        margin: 0;
        color: var(--sub);
      }

      .footer {
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="hero">
        <h1>サポート</h1>
      </section>

      <section class="section">
        <h2>お問い合わせ</h2>
        <p><a href="mailto:apurisapoto25@gmail.com">apurisapoto25@gmail.com</a></p>
      </section>

      <p class="footer">© 2026 Apps</p>
    </main>
  </body>
</html>
