<!doctype html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Apps</title>

<style>
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --line: #d8e0ec;
  --text: #101827;
  --sub: #465469;
  --muted: #758196;
  --accent: #3b4a63;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
  line-height: 1.75;
  background: linear-gradient(180deg, #ffffff, var(--bg));
}

a {
  color: inherit;
  text-decoration: none;
}

.wrap {
  width: min(880px, calc(100% - 24px));
  margin: 24px auto 36px;
}

.hero,
.section {
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--card);
  box-shadow: 0 12px 28px rgba(32, 46, 70, 0.08);
}

.hero {
  padding: 26px 22px;
}

.section {
  margin-top: 14px;
  padding: 20px;
}

h1 {
  margin: 0;
  font-size: clamp(28px, 5vw, 40px);
  line-height: 1.3;
}

h2 {
  margin: 0 0 14px;
  font-size: 20px;
}

p {
  margin: 8px 0 0;
  color: var(--sub);
}

.links {
  display: grid;
  gap: 12px;
}

.link-card {
  display: block;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fff;
  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease;
}

.link-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(32, 46, 70, 0.08);
}

.link-title {
  font-weight: 700;
  color: var(--text);
}

.link-description {
  margin-top: 4px;
  color: var(--sub);
  font-size: 14px;
}

.footer {
  margin-top: 14px;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}
</style>
</head>

<body>

<main class="wrap">

<section class="hero">
  <h1>Apps</h1>
  <p>
    当開発者が提供するiOSアプリに関する
    サポート情報とプライバシーポリシーを掲載しています。
  </p>
</section>

<section class="section">
  <h2>公開情報</h2>

  <div class="links">

    <a class="link-card" href="support.html">
      <div class="link-title">サポート</div>
      <div class="link-description">
        お問い合わせはこちら
      </div>
    </a>

    <a class="link-card" href="privacy.html">
      <div class="link-title">プライバシーポリシー</div>
      <div class="link-description">
        データの取り扱いと広告について
      </div>
    </a>

  </div>
</section>

<p class="footer">© 2026 Apps</p>

</main>

</body>
</html>
